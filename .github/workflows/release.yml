name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Understudy-windows.zip
          - os: macos-14
            artifact: Understudy-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        # npm install (not ci) so a version-only lockfile drift can't fail the build
        run: npm --prefix frontend install && npm --prefix frontend run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Fetch bundled models
        run: python packaging/fetch_models.py

      - name: PyInstaller
        run: pyinstaller packaging/understudy.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path packaging/dist/Understudy/* -DestinationPath ${{ matrix.artifact }}

      # Apple Silicon refuses to run a binary with no / broken signature, so
      # ad-hoc sign the whole bundle (deep). Not notarized; users still grant
      # it once via Privacy & Security, but it won't be reported as "damaged".
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - packaging/dist/Understudy.app
          codesign --verify --deep --strict packaging/dist/Understudy.app && echo "signature ok"

      # ditto preserves the .app's symlinks + signature; plain `zip` corrupts
      # them and macOS then reports the app as "damaged".
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent packaging/dist/Understudy.app ${{ matrix.artifact }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
